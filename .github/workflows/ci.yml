name: ci
on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest tests/unit tests/component -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # type-check + production build
  integration:
    # The third tier: the real stack (api, worker, postgres, redis, web) started
    # with docker compose, and tests/integration run against it over HTTP.
    needs: lint-and-unit
    runs-on: ubuntu-latest
    env:
      # A throwaway key that only exists inside this CI job's database.
      SEED_API_KEY: ci-only-integration-key-not-a-secret-0001
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:8000/readyz && exit 0
            sleep 2
          done
          echo "API never became ready"; exit 1
      - name: Seed the demo API key
        run: docker compose run --rm api python -m scripts.seed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Integration tests
        env:
          INTEGRATION: "1"
          BASE_URL: http://localhost:8000
        run: pytest tests/integration -q
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop the stack
        if: always()
        run: docker compose down -v
